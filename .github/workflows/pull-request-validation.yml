name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pull-request-validation.yml"
      - ".github/workflows/release.yml"
      - "analysis_options.yaml"
      - "assets/**"
      - "fonts/**"
      - "installer/windows/**"
      - "l10n.yaml"
      - "lib/**"
      - "macos/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "scripts/**"
      - "test/**"
      - "tool/**"
      - "windows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  windows-validation:
    name: Test and package Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Verify NuGet
        shell: pwsh
        run: ./scripts/verify_nuget.ps1

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Pull LFS databases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git lfs install
          git lfs pull --include="assets/databases/*.db"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate bundled autocomplete databases
        run: dart run tool/tag_catalog/verify_bundled_databases.dart

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run tool/generate.dart

      - name: Verify generated files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code

      - name: Run tests
        run: flutter test --reporter compact

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release --no-pub --no-tree-shake-icons

      - name: Validate installer process handling
        shell: pwsh
        run: ./scripts/validate_windows_installer_process_handling.ps1

      - name: Prepare Node runtime and Agent dependencies
        shell: pwsh
        run: ./scripts/prepare_windows_node_runtime.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wof-node-runtime')

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (!$match) {
            throw 'pubspec.yaml does not contain a version field.'
          }
          $version = $match.Matches[0].Groups[1].Value.Trim()
          ./scripts/package_windows_release.ps1 `
            -Version $version `
            -SkipFlutterBuild `
            -NodeRuntimeDirectory (Join-Path $env:RUNNER_TEMP 'wof-node-runtime')

      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $match.Matches[0].Groups[1].Value.Trim() -replace '\+.*$', ''
          $required = @(
            "dist/WOF_NAI_Studio_Windows_${version}_Setup.exe",
            "dist/WOF_NAI_Studio_Windows_${version}_Portable.zip"
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Missing packaged artifact: $path"
            }
          }

  macos-validation:
    name: Build and package macOS
    runs-on: macos-15
    # Release build of the universal app bundle plus the packaging checks,
    # and the few tests that only reach their macOS branch on a Mac; all
    # other tests run in the Windows job. Nothing is uploaded.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Node and Dart runtimes
        uses: actions/cache@v4
        with:
          path: build/macos-runtime-cache
          key: macos-runtime-${{ hashFiles('scripts/build_macos.sh', 'tool/flutter-sdk.json') }}

      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run tool/generate.dart

      - name: Run macOS-only tests
        # These skip or take their Windows branch elsewhere: floating
        # resource windows, window close and quit order, the 1.x data copy,
        # RAG host detection, CommonCrypto hashing, Finder open / reveal,
        # path case in the storage statistics and the Agent's built-in skills
        # inside the app bundle.
        run: >-
          flutter test --no-pub
          test/presentation/wiring/resource_window_opener_test.dart
          test/app_exit_shortcuts_test.dart
          test/core/services/mac_legacy_data_import_test.dart
          test/core/rag/rag_platform_test.dart
          test/core/utils/file_sha256_test.dart
          test/app_test.dart
          test/presentation/wiring/settings_storage_inventory_test.dart
          test/presentation/providers/nai_agent/nai_agent_builtin_skills_path_test.dart

      - name: Build macOS release
        run: scripts/build_macos.sh --release

      - name: Package macOS artifact
        run: scripts/package_macos_release.sh

      - name: Verify packaged artifact
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          zip="dist/WOF_NAI_Studio_macOS_${version%%+*}_Portable.zip"
          test -f "$zip"
          test -f "$zip.sha256"
